
name: World Bank ETL CI and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-publish:
    name: Test and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Run unit tests
      - name: Run unit and integration tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/unit tests/integration -v --cov=worldbank_etl --cov-report=term-missing

      # 5. Generate Docker image metadata and tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # 6. Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Build and publish Docker image
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

jobs:
  test-and-publish:
    name: Test and Publish Docker Image
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: worldbank_etl_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d worldbank_etl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUN_DB_INTEGRATION_TESTS: "1"

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: worldbank_etl_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_SCHEMA: public
      DB_TABLE: world_bank_observations_test
      DB_BATCH_SIZE: 1000

      WB_BASE_URL: https://api.worldbank.org/v2
      WB_COUNTRY: IND
      WB_INDICATOR: SP.POP.TOTL
      WB_START_YEAR: 2000
      WB_END_YEAR: 2024
      WB_PAGE_SIZE: 100
      WB_TIMEOUT_SECONDS: 30
      WB_MAX_RETRIES: 3
      WB_BACKOFF_FACTOR: 1
      APP_ENV: testing
      LOG_LEVEL: INFO